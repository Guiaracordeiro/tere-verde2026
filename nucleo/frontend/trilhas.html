<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilhas - Terê Verde Online</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <div class="conteudo">
            <a href="index.html">
                <img src="img/tere verde sem fundo.png" alt="Logo Terê Verde Online" class="logo">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="trilhas.html" class="active">Trilhas</a></li>
                    <li><a href="cachoeiras.html">Cachoeiras</a></li>
                    <li><a href="eventos.html">Eventos</a></li>
                    <li><a href="admin-login.html">Área Restrita</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="titulo-pagina">
            <div class="conteudo">
                <h1>Trilhas de Teresópolis</h1>
                <p>Descubra os principais roteiros de montanhismo e caminhada ecológica.</p>
            </div>
        </section>

        <section class="conteudo">
            <div id="lista-trilhas" class="grade-cards">
                <p style="text-align: center; width: 100%; color: #666;">Carregando trilhas...</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="conteudo">
            <p>© 2026 Terê Verde Online. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        async function buscarTrilhas() {
            const container = document.getElementById('lista-trilhas');
            try {
                const res = await fetch('http://127.0.0.1:8000/api/trilhas/');
                if (!res.ok) throw new Error();
                const trilhas = await res.json();

                if (!Array.isArray(trilhas) || trilhas.length === 0) {
                    container.innerHTML = '<p style="text-align: center; width: 100%; color: #666;">Nenhuma trilha cadastrada ainda.</p>';
                    return;
                }

                container.innerHTML = trilhas.map(t => `
                    <div class="card">
                        <div class="card-corpo">
                            <span class="badge">${t.dificuldade || 'Geral'}</span>
                            <h3>${t.nome}</h3>
                            <p><strong>Parque:</strong> ${t.parque}</p>
                            <p><strong>Distância:</strong> ${t.extensao_km} km | <strong>Tempo:</strong> ${t.tempo_estimado}</p>
                            <p>${t.descricao || ''}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p style="text-align: center; width: 100%; color: #c0392b;">Não foi possível carregar as trilhas da API no momento.</p>';
            }
        }
        buscarTrilhas();
    </script>
</body>
</html>
