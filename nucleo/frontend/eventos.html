<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos e Atividades - Terê Verde Online</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <div class="conteudo">
            <a href="index.html">
                <img src="img/tere verde sem fundo.png" alt="Logo Terê Verde Online" class="logo">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="trilhas.html">Trilhas</a></li>
                    <li><a href="cachoeiras.html">Cachoeiras</a></li>
                    <li><a href="eventos.html" class="active">Eventos</a></li>
                    <li><a href="admin-login.html">Área Restrita</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="titulo-pagina">
            <div class="conteudo">
                <h1>Agenda de Eventos Ecológicos</h1>
                <p>Acompanhe mutirões, passeios guiados e encontros ao ar livre.</p>
            </div>
        </section>

        <section class="conteudo">
            <div id="lista-eventos" class="grade-cards">
                <p style="text-align: center; width: 100%; color: #666;">Carregando eventos...</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="conteudo">
            <p>© 2026 Terê Verde Online. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        async function buscarEventos() {
            const container = document.getElementById('lista-eventos');
            try {
                const res = await fetch('http://127.0.0.1:8000/api/eventos/');
                if (!res.ok) throw new Error('Falha na resposta da API');
                const eventos = await res.json();

                if (!Array.isArray(eventos) || eventos.length === 0) {
                    container.innerHTML = '<p style="text-align: center; width: 100%; color: #666;">Nenhum evento agendado no momento.</p>';
                    return;
                }

                container.innerHTML = eventos.map(ev => `
                    <div class="card">
                        <div class="card-corpo">
                            <span class="badge">${ev.parque_relacionado || 'Teresópolis'}</span>
                            <h3>${ev.titulo}</h3>
                            <p><strong>Data:</strong> ${ev.data_evento} ${ev.horario ? 'às ' + ev.horario : ''}</p>
                            <p><strong>Local:</strong> ${ev.local || 'A definir'}</p>
                            <p>${ev.descricao || ''}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p style="text-align: center; width: 100%; color: #c0392b;">Não foi possível carregar os eventos da API no momento.</p>';
            }
        }
        buscarEventos();
    </script>
</body>
</html>
