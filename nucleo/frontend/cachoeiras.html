<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cachoeiras - Terê Verde Online</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <div class="conteudo">
            <a href="index.html">
                <img src="img/tere verde sem fundo.png" alt="Logo Terê Verde Online" class="logo">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="trilhas.html">Trilhas</a></li>
                    <li><a href="cachoeiras.html" class="active">Cachoeiras</a></li>
                    <li><a href="eventos.html">Eventos</a></li>
                    <li><a href="admin-login.html">Área Restrita</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="titulo-pagina">
            <div class="conteudo">
                <h1>Cachoeiras e Poços Naturais</h1>
                <p>Refresque-se nas águas cristalinas da Serra dos Órgãos.</p>
            </div>
        </section>

        <section class="conteudo">
            <div id="lista-cachoeiras" class="grade-cards">
                <p style="text-align: center; width: 100%; color: #666;">Carregando cachoeiras...</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="conteudo">
            <p>© 2026 Terê Verde Online. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        async function buscarCachoeiras() {
            const container = document.getElementById('lista-cachoeiras');
            try {
                const res = await fetch('http://127.0.0.1:8000/api/cachoeiras/');
                if (!res.ok) throw new Error();
                const cachoeiras = await res.json();

                if (!Array.isArray(cachoeiras) || cachoeiras.length === 0) {
                    container.innerHTML = '<p style="text-align: center; width: 100%; color: #666;">Nenhuma cachoeira cadastrada ainda.</p>';
                    return;
                }

                container.innerHTML = cachoeiras.map(c => `
                    <div class="card">
                        <div class="card-corpo">
                            <span class="badge">${c.tipo_acesso || 'Acesso Normal'}</span>
                            <h3>${c.nome}</h3>
                            <p><strong>Parque:</strong> ${c.parque}</p>
                            <p><strong>Própria para banho:</strong> ${c.propria_banho ? 'Sim' : 'Não'}</p>
                            <p>${c.descricao || ''}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p style="text-align: center; width: 100%; color: #c0392b;">Não foi possível carregar as cachoeiras da API no momento.</p>';
            }
        }
        buscarCachoeiras();
    </script>
</body>
</html>
